<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RadioApp Welcome Greeting Prototype</title>
  <style>
    :root {
      --neon-cyan: #00d9ff;
      --neon-magenta: #ff006e;
      --neon-purple: #8338ec;
      --neon-electric: #7b2cbf;
      --neon-mint: #00f5d4;
      --neon-gold: #ffd23f;
      --neon-dark-bg: #0a0a0f;
      --neon-card-bg: #151520;
      --neon-surface-bg: #1a1a2e;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.68);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(0, 217, 255, 0.22), transparent 31%),
        radial-gradient(circle at 78% 6%, rgba(255, 0, 110, 0.18), transparent 30%),
        radial-gradient(circle at 78% 76%, rgba(131, 56, 236, 0.2), transparent 34%),
        linear-gradient(145deg, #08080d 0%, var(--neon-dark-bg) 46%, #10101a 100%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: 0.06;
      background-image:
        linear-gradient(rgba(255,255,255,0.65) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.65) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at center, black, transparent 74%);
    }

    body::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: 0.03;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.8) 0,
          rgba(255,255,255,0.8) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    .shell {
      position: relative;
      width: min(100%, 1080px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 48px 28px 120px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 22px;
    }

    .title-block {
      min-width: 0;
      flex: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 9vw, 72px);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--neon-cyan);
      font-size: 17px;
      font-weight: 700;
    }

    .shuffle {
      display: grid;
      width: 54px;
      height: 54px;
      flex: none;
      place-items: center;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--neon-magenta), var(--neon-purple));
      box-shadow:
        0 0 10px rgba(255, 0, 110, 0.64),
        0 0 28px rgba(255, 0, 110, 0.34);
      color: #fff;
    }

    .greeting-card {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      padding: 15px 16px;
      overflow: hidden;
      border: 1px solid rgba(0, 217, 255, 0.32);
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(0, 217, 255, 0.13), rgba(255, 0, 110, 0.09)),
        rgba(21, 21, 32, 0.68);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 24px rgba(0, 217, 255, 0.14);
      backdrop-filter: blur(22px);
    }

    .greeting-card::before {
      position: absolute;
      top: -70%;
      right: 8%;
      width: 180px;
      height: 180px;
      content: "";
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255, 210, 63, 0.24), transparent 64%);
    }

    .signal {
      position: relative;
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 14px;
      background: rgba(0, 217, 255, 0.12);
      color: var(--neon-cyan);
      box-shadow: inset 0 0 0 1px rgba(0, 217, 255, 0.28);
    }

    .signal svg,
    .shuffle svg,
    .search svg,
    .play svg,
    .heart svg {
      display: block;
    }

    .greeting-text {
      position: relative;
      min-width: 0;
      margin: 0;
      color: rgba(255,255,255,0.88);
      font-size: clamp(15px, 2.7vw, 17px);
      font-weight: 650;
      line-height: 1.6;
    }

    .station-name {
      color: #fff;
      text-shadow:
        0 0 8px rgba(0, 217, 255, 0.7),
        0 0 18px rgba(255, 0, 110, 0.35);
      white-space: nowrap;
    }

    .morning-chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .search-card {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      background: rgba(21, 21, 32, 0.72);
      backdrop-filter: blur(22px);
    }

    .search {
      flex: none;
      color: var(--neon-cyan);
    }

    .placeholder {
      min-width: 0;
      flex: 1;
      color: rgba(255, 255, 255, 0.42);
      font-size: 16px;
    }

    .spark {
      color: var(--neon-purple);
    }

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .section-note {
      margin: 7px 0 0;
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      line-height: 1.4;
    }

    .queue-note {
      color: rgba(0, 217, 255, 0.78);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .station-card {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 13px;
      padding: 13px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      background: rgba(21, 21, 32, 0.72);
      backdrop-filter: blur(22px);
    }

    .station-card.primary {
      border-color: rgba(0, 217, 255, 0.62);
      box-shadow:
        0 0 8px rgba(0, 217, 255, 0.46),
        0 0 24px rgba(0, 217, 255, 0.22);
    }

    .cover {
      display: grid;
      width: 64px;
      height: 64px;
      flex: none;
      place-items: center;
      border-radius: 18px;
      background:
        radial-gradient(circle at 30% 28%, rgba(255, 210, 63, 0.95), transparent 28%),
        linear-gradient(135deg, var(--neon-cyan), var(--neon-purple) 48%, var(--neon-magenta));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
      color: #fff;
    }

    .station-copy {
      min-width: 0;
      flex: 1;
    }

    .station-title {
      overflow: hidden;
      margin: 0 0 5px;
      color: #fff;
      font-size: 16px;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .station-tags {
      overflow: hidden;
      margin: 0 0 10px;
      color: var(--neon-cyan);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-weight: 700;
    }

    .heart {
      display: grid;
      width: 40px;
      height: 40px;
      flex: none;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 999px;
      background: rgba(255,255,255,0.045);
      color: rgba(255,255,255,0.62);
    }

    .bottom-player {
      position: fixed;
      right: 22px;
      bottom: 22px;
      left: 22px;
      display: flex;
      width: min(calc(100% - 44px), 720px);
      margin: 0 auto;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 22px;
      background: rgba(16, 16, 26, 0.88);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(24px);
    }

    .play {
      display: grid;
      width: 46px;
      height: 46px;
      flex: none;
      place-items: center;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--neon-magenta), var(--neon-purple));
      color: #fff;
      box-shadow:
        0 0 10px rgba(255, 0, 110, 0.6),
        0 0 22px rgba(255, 0, 110, 0.35);
    }

    .player-title {
      min-width: 0;
      flex: 1;
    }

    .player-title strong,
    .player-title span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-title strong {
      color: #fff;
      font-size: 14px;
    }

    .player-title span {
      margin-top: 3px;
      color: rgba(255,255,255,0.52);
      font-size: 12px;
    }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .queue-note {
        display: none;
      }
    }

    @media (max-width: 560px) {
      .shell {
        padding: 40px 16px 116px;
      }

      .topbar {
        gap: 14px;
      }

      .shuffle {
        width: 48px;
        height: 48px;
      }

      .greeting-card {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .morning-chip {
        grid-column: 1 / -1;
        width: max-content;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="title-block">
        <h1>发现</h1>
        <p class="subtitle">探索全球电台</p>
      </div>
      <button class="shuffle" aria-label="随便听听">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M16 3h5v5M4 20l17-17M21 16v5h-5M15 15l6 6M4 4l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <section class="greeting-card" aria-label="欢迎语">
      <div class="signal" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M4 12a8 8 0 0 1 16 0M7 12a5 5 0 0 1 10 0M10 12a2 2 0 0 1 4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 14v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="greeting-text">
        是缘分让我们偶遇，从<span class="station-name">「清晨音乐台」</span>开始吧，希望你能遇到心仪的歌曲～
      </p>
      <span class="morning-chip">今日第一站</span>
    </section>

    <section class="search-card" aria-label="搜索">
      <span class="search" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="placeholder">搜索电台、风格、地区...</span>
      <span class="spark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </span>
    </section>

    <section>
      <div class="section-header">
        <div>
          <h2>推荐电台</h2>
          <p class="section-note">先从熟悉又稳定的台开始。</p>
        </div>
        <span class="queue-note">为你亮起清晨音乐台</span>
      </div>

      <div class="grid">
        <article class="station-card primary">
          <div class="cover" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
              <path d="M9 18V5l10-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="7" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
              <circle cx="17" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
          </div>
          <div class="station-copy">
            <p class="station-title">清晨音乐台</p>
            <p class="station-tags">music, pop music</p>
            <span class="meta">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              MP3
            </span>
          </div>
          <button class="heart" aria-label="收藏 清晨音乐台">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </button>
        </article>

        <article class="station-card">
          <div class="cover" aria-hidden="true"></div>
          <div class="station-copy">
            <p class="station-title">CNR-3 音乐之声</p>
            <p class="station-tags">classic, live</p>
            <span class="meta">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              HLS
            </span>
          </div>
          <button class="heart" aria-label="收藏 CNR-3 音乐之声">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </button>
        </article>

        <article class="station-card">
          <div class="cover" aria-hidden="true"></div>
          <div class="station-copy">
            <p class="station-title">AsiaFM 亚洲经典</p>
            <p class="station-tags">chinese, music</p>
            <span class="meta">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              MP3
            </span>
          </div>
          <button class="heart" aria-label="收藏 AsiaFM 亚洲经典">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </button>
        </article>
      </div>
    </section>
  </main>

  <aside class="bottom-player" aria-label="迷你播放器">
    <button class="play" aria-label="播放 清晨音乐台">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>
    <div class="player-title">
      <strong>从清晨音乐台开始</strong>
      <span>希望你能遇到心仪的歌曲</span>
    </div>
  </aside>
</body>
</html>
